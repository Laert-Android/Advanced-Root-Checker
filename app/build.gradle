plugins {
    id 'com.android.application'
}

android {
    namespace 'com.laert.rootchecker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.laert.rootchecker'
        minSdk 19
        targetSdk 34
        versionCode 10
        versionName '3.4'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
