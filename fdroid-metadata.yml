AutoName: Advanced Root Checker
Summary: Offline root detection, no ads, no tracking
Description: |-
  Advanced Root Checker detects root indicators on your
  Android device. All 17 checks run entirely offline.
  No internet permission, no ads, no tracking, no analytics.

  Detects su binaries, Magisk, SuperSU, BusyBox, Xposed,
  dangerous apps, root cloaking apps, dangerous system
  properties, SELinux status and more.

  Also shows device security info and explains the
  importance of root access with benefits and risks.

  Built with pure Java, no external libraries.

